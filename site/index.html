<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Игры</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1a1a1b;
        --muted: #6b6b6e;
        --border: #d3d6da;
        --accent: #538d4e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121213;
          --fg: #f2f2f2;
          --muted: #a0a0a4;
          --border: #3a3a3c;
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }
      h1 {
        font-size: 1.6rem;
        margin: 0 0 16px;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 8px;
      }
      a.game {
        display: block;
        padding: 12px 16px;
        color: inherit;
        text-decoration: none;
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      a.game:hover,
      a.game:focus-visible {
        border-color: var(--accent);
      }
      .desc {
        color: var(--muted);
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Игры</h1>
      <ul>
        <li>
          <a class="game" href="five-letters/">
            <strong>5 букв</strong>
            <div class="desc">Помощник: подходящие слова и лучший следующий ход</div>
          </a>
        </li>
      </ul>
    </main>
  </body>
</html>
